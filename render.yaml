services:
  - type: web
    name: nemvia-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
